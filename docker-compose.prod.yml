services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sharelive?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=SrlxrQ30v49c+tMNeiTkkM88Xk1/zGPLAAzG5iTlZuI=
      - UPLOAD_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=https://coding.dashscope.aliyuncs.com/v1
      - OPENAI_MODEL=kimi-k2.5
      - ADMIN_EMAILS=1589525237@qq.com
      - NODE_ENV=production
    depends_on:
      - db
    networks:
      - sharelive-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sharelive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sharelive-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  sharelive-network:
    driver: bridge
