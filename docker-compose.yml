services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_OPTIONS=--max-old-space-size=1280
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sharelive?schema=public
      - NEXTAUTH_URL=http://101.34.245.133:3000
      - NEXTAUTH_SECRET=SrlxrQ30v49c+tMNeiTkkM88Xk1/zGPLAAzG5iTlZuI=
      - UPLOAD_PROVIDER=minio
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=sharelive
      - MINIO_SECRET_KEY=sharelive2024
      - MINIO_BUCKET_NAME=sharelive-uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=https://ai-01.waveterm.in/v1
      - OPENAI_MODEL=nvidia/moonshotai/kimi-k2.5
      - NODE_OPTIONS=--max-old-space-size=384
    depends_on:
      - db
      - minio
    volumes:
      - uploads:/app/public/uploads
    networks:
      - sharelive-network

  db:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sharelive
      - POSTGRES_SHARED_BUFFERS=64MB
      - POSTGRES_WORK_MEM=8MB
      - POSTGRES_MAINTENANCE_WORK_MEM=32MB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sharelive-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=sharelive
      - MINIO_ROOT_PASSWORD=sharelive2024
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - sharelive-network

volumes:
  postgres-data:
  uploads:
  minio-data:

networks:
  sharelive-network:
    driver: bridge
